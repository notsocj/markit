<!-- marKit app icon, full-bleed square (1024x1024): a post with one line marked by a highlighter.
     Use this where the platform rounds the corners itself (iOS, Android adaptive icons, PWA "maskable").
     The artwork stays inside the Android adaptive-icon safe circle (66/108 of the canvas), so masks never clip it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="marKit">
<defs>
  <linearGradient id="mk-bg" x1="160" y1="0" x2="864" y2="1024" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3D6BFF"/><stop offset="1" stop-color="#1432C4"/></linearGradient>
  <radialGradient id="mk-sheen" cx="512" cy="-80" r="720" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="mk-ink" x1="0" y1="436" x2="0" y2="588" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFE65C"/><stop offset="1" stop-color="#FFD634"/></linearGradient>
</defs>
<rect width="1024" height="1024" fill="url(#mk-bg)"/>
<rect width="1024" height="1024" fill="url(#mk-sheen)"/>
<g transform="translate(512 512) scale(1) translate(-491 -512)">
  <!-- first line of the post -->
  <rect x="232" y="304" width="560" height="80" rx="40" fill="#fff" fill-opacity=".5"/>
  <!-- the highlighter stroke: chisel-cut ends, tilted a hair upward like a real swipe -->
  <path d="M214 442 L760 434 L738 584 L190 590 Z" fill="url(#mk-ink)" stroke="url(#mk-ink)" stroke-width="18" stroke-linejoin="round"/>
  <!-- the marked line, in dark ink under the highlight -->
  <rect x="232" y="472" width="452" height="80" rx="40" fill="#0F2496"/>
  <!-- last line of the post -->
  <rect x="232" y="640" width="340" height="80" rx="40" fill="#fff" fill-opacity=".5"/>
</g>
</svg>
